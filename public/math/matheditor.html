<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>MLQ (Melique) Editor</title>
    <meta name="description" content="">
    <meta name="author" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="css/math.css?v=16464">
    <link rel="stylesheet" href="css/skeleton.css?v=16464">
    <link rel="stylesheet" href="css/normalize.css?v=16464">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js" integrity="sha384-cpW21h6RZv/phavutF+AuVYrr+dA8xD9zs6FwLpaCct6O9ctzYFfFr4dgmgccOTx" crossorigin="anonymous"></script>
    <script src="js/lib/latex-to-js.js"></script>
    <script src="js/lib/mathml2latex.js"></script>
    <script src="js/lib/keypress-2.1.5.min.js"></script>
    <script src="js/lib/webtoolkit-base64.js"></script>
    <script src="js/lib/temml.min.js"></script>
    <script src="js/symbol-entities.js?v=16464" defer></script>
    <script src="js/math-editor.js?v=16464" defer></script>
    <script src="js/lib/lz-string.js"></script>
    <script src="js/lib/nerdamer/all.min.js"></script>
    <script src="js/lib/function-plot.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" integrity="sha384-GvrOXuhMATgEsSwCs4smul74iXGOixntILdUW9XmUC6+HX0sLNAK3q71HotJqlAn" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js" integrity="sha384-cpW21h6RZv/phavutF+AuVYrr+dA8xD9zs6FwLpaCct6O9ctzYFfFr4dgmgccOTx" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Charis+SIL&display=swap" rel="stylesheet">
  </head>

  <body>
    <div class="container">
      <div class="oframe mt-2">
	<nav class="navbar navbar-expand-lg navbar-dark bg-custom shadow-lg rounded">
          <a id="aboutus" class="navbar-brand" data-toggle="modal" data-target="#aboutusModal">
            <img class="logo" src="img/mlq_logo.svg">
          </a>
          <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="menus">
              <ul class="navbar-nav ms-auto">
		<li class="nav-item dropdown shadow-lg p-1 m-2 mb-2 bg-white rounded">
                  <a id="subsup" title="subscript superscript" style="font-size: 24px;" class="nav-link dropdown-toggle navmenufont" href="#" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"></a>
		</li>

		<li class="nav-item dropdown shadow-lg p-1 m-2 mb-2 bg-white rounded">
                  <a id="root" title="square root" class="nav-link dropdown-toggle navmenufont" href="#" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"></a>
		</li>
		<!-- <div class="dropdown-divider"></div> -->
		<li class="nav-item dropdown shadow-lg p-1 m-2 mb-2 bg-white rounded">
                  <a id="frac" title="fraction" class="nav-link dropdown-toggle navmenufont" href="#" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"></a>
		</li>
		<li class="nav-item dropdown shadow-lg p-1 m-2 mb-2 bg-white rounded">
                  <a id="underover" title="under and over" class="nav-link dropdown-toggle navmenufont" href="#" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"></a>
		</li>

		<li class="nav-item dropdown shadow-lg p-1 m-2 mb-2 bg-white rounded">
                  <a id="xunderover" title="xunder and over" class="nav-link dropdown-toggle navmenufont" href="#"
                     role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"></a>
		</li>
		<li class="nav-item dropdown shadow-lg p-1 m-2 mb-2 bg-white rounded">
                  <a id="matrix" title="fence and matrices" class="nav-link dropdown-toggle" href="#" role="button"
                     data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"></a>
		</li>

		<li class="nav-item dropdown shadow-lg p-1 m-2 mb-2 bg-white rounded">
                  <a id="greek" title="greek" class="nav-link dropdown-toggle navmenufont" href="#" role="button"
                     data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"></a>
		</li>
		<li class="nav-item dropdown shadow-lg p-1 m-2 mb-2 bg-white rounded">
                  <a id="math" title="math symbols" class="nav-link dropdown-toggle navmenufont" href="#" role="button"
                     data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"></a>
		</li>

		<li class="nav-item dropdown shadow-lg p-1 m-2 mb-2 bg-white rounded">
                  <a id="text" title="math symbols" class="nav-link dropdown-toggle navmenufont" href="#" role="button"
                     data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"></a>
		</li>
		<li class="nav-item dropdown shadow-lg p-1 m-2 mb-2 bg-white rounded">
                  <a id="latex" title="math symbols" class="nav-link navmenufont" href="#" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"></a>
		</li>
              </ul>
            </div>
          </div>
	</nav>
      </div>
      <br>
      <div class="iframe col-md-12 col-sm-12 col-lg-12 shadow rounded">
	<div class="misc-buttons">
	  <button class="button button-primary" title="Undo" id="undo"><i class="fa fa-undo"></i></button>
	  <button class="button button-primary" title="Undo" id="redo"><i class="fas fa-redo"></i></button>
	  <button class="button button-primary" title="copy link" id="copylink"><i class="fa fa-link"></i></button>
	</div>
	<div class="row">
          <div class="output mt-5 shadow-lg"
               style="max-height: 180px;padding: 7px;margin-left: 25px;margin-right: 25px;font-size: 25px;"
	       data-math-index="-1"
               contentEditable="true">
            <math displaystyle="true">
              <mi>&nbsp;</mi>
            </math>
          </div>
          <br>
	</div>
	<div class="misc-buttons">
	  <button class="button button-primary" title="copy mathml" id="copymml"><i class="far fa-copy"></i></button>
	  <select id="mode">
	    <option value="txt">Text</option>
	    <option value="tex">LaTeX</option>
	    <option value="mml">MathML</option>
	  </select>
	  <button class="button button-primary" title="Save" id="savemath"><i class="fas fa-save"></i></button>
	  <select id="mathname">
	    <option value="default">Default</option>
	    <option value="new">Add New</option>
	  </select>
	  <input type="number" id="mathid" value="0" />
	  <button class="button button-primary" title="Delete" id="deletemath"><i class="fa fa-trash"></i></button>
	  <button class="button button-primary" title="Save to file" id="save2file"><i class="fas fa-save"></i>*</button>
	  <label class="label" title="load file">
	    <input type="file"  id="file-input" required/>
	    <i class="fas fa-file-import"></i>
	  </label>
	</div>
	<textarea id="output_text" cols="100" rows="10"></textarea>
	<br>
	<select id="smode">
	  <option value="solve">Solve</option>
	  <option value="simplify">Simplify</option>
	  <option value="expand">Expand</option>
	  <option value="evaluate">Evaluate</option>
	  <option value="diff">Differentiate</option>
	  <option value="integrate">Integrate</option>
	  <option value="plot">Plot</option>
	</select>
	<button id="submit" class="button button-primary">Submit</button>
	<br>
	<div id="solution_text"></div>
	<div id="plot"></div>
      </div>
      <div>
	<div class="keywords">
          <p>Keywords: <span id="kwd"></span></p>
	</div>
      </div>
    </div>
    <div id="katex_display"></div>
    <div class="modal fade" id="textModal" tabindex="-1" role="dialog" aria-labelledby="textModalLabel"
	 aria-hidden="true">
      <div class="modal-dialog" role="document">
	<div class="modal-content">
          <div class="modal-header" style="background-color: #213c54;color: white;">
            <h5 class="modal-title" id="textModalLabel">Text</h5>
            <button type="button" style="color: white;" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <label class="modallabel" for="txtText">Enter Text:</label>
            <textarea class="form-control" id="txtText" placeholder="ABCabc..."> </textarea>
          </div>
          <div class="modal-footer">
            <button type="button" style="background-color:#3675ab !important" class="btn btn-secondary btnpopup"
		    data-dismiss="modal">Close</button>
            <button type="button" id="btnTxtModalOk" class="btn btn-primary btnpopup">Ok</button>
          </div>
	</div>
      </div>
    </div>

    <div class="modal fade" id="latexModal" tabindex="-1" role="dialog" aria-labelledby="latexModalLabel"
	 aria-hidden="true">
      <div class="modal-dialog" role="document">
	<div class="modal-content">
          <div class="modal-header" style="background-color: #213c54;color: white;">
            <h5 class="modal-title" id="latexModalLabel">TeX/LaTeX</h5>
            <button type="button" style="color: white;" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <label class="modallabel" for="txtLatex">Enter TeX/LaTeX input:</label>
            <textarea class="form-control" id="txtLatex" placeholder=""> </textarea>
          </div>
          <div class="modal-footer">
            <button type="button" style="background-color:#3675ab !important" class="btn btn-secondary btnpopup"
		    data-dismiss="modal">Close</button>
            <button type="button" id="btnLatexModalOk" class="btn btn-primary btnpopup">Ok</button>
          </div>
	</div>
      </div>
    </div>

    <div class="modal fade" id="aboutusModal" tabindex="-1" role="dialog" aria-labelledby="aboutusModalLabel"
	 aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered" role="document">
	<div class="modal-content">
          <div class="modal-header" style="background-color: #213c54;color: white;">
            <h5 class="modal-title" id="aboutusModalLabel">About Us</h5>
            <button type="button" style="color: white;" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <p>MLQ - WYSIWYG MathML Equation Editor</p>
            <p>All rights reserved. CQRL Bits LLP © 2023</p>
            <p>(cqrlbits@gmail.com)</p>
          </div>
          <div class="modal-footer">
          </div>
	</div>
      </div>
    </div>


    <div class="modal fade" id="matrixModal" tabindex="-1" role="dialog" aria-labelledby="matrixmodallabel" aria-hidden="true">
      <div class="modal-dialog" role="document">
	<div class="modal-content">
          <div class="modal-header" style="background-color: #213c54;color: white;">
            <h5 class="modal-title" id="matrixmodallabel">Custom Matrix</h5>
            <button type="button" style="color: white;" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <div class="row">
              <div style="width:50%;">
		<div class="col-md-10 col-sm-10 col-xs-10 col-ls-10">
                  <label class="modallabel" for="txtModalRows">Rows:</label>
		</div>
		<div class="col-md-10 col-sm-10 col-xs-10 col-ls-10">
                  <input type="number" class="form-control" id="txtModalRows" />
		</div>
              </div>
              <div style="width:50%;">
		<div class="col-md-10 col-sm-10 col-xs-10 col-ls-10">
                  <label class="modallabel" for="txtModalColumns">Columns:</label>
		</div>
		<div class="col-md-10 col-sm-10 col-xs-10 col-ls-10">
                  <input type="number" class="form-control" id="txtModalColumns" />
		</div>
              </div>
            </div>


            <br>
            <div class="Row">
              <label class="modallabel">Matrix bracket:</label>
              <select id="ddlMatrixbracket" style="color: #3090ff;font-size: 1.3rem;" class="form-control">
		<option value="(-)"><math><mo>(</mo><mi>&square;</mi><mo>)</mo></math></option>
		<option value="{-}"><math><mo>{</mo><mi>&square;</mi><mo>}</mo></math></option>
		<option value="|-|"><math><mo>|</mo><mi>&square;</mi><mo>|</mo></math></option>
		<option value="[-]"><math><mo>[</mo><mi>&square;</mi><mo>]</mo></math></option>
		<option value="-"><math><mi>&square;</mi></math></option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" style="background-color:#3675ab !important" class="btn btn-secondary btnpopup"
		    data-dismiss="modal">Close</button>
            <button type="button" id="btnTxtMatrixModalOk" class="btn btn-primary btnpopup">Ok</button>
          </div>
	</div>
      </div>
    </div>
  </body>
</html>
